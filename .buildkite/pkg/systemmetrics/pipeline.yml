# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
# Tests every package under pkg/. It still runs as the beats-pkg-systemmetrics
# pipeline from this path because that is how it is registered in
# catalog-info.yaml.
name: "beats-pkg-systemmetrics"

env:
  GCP_DEFAULT_MACHINE_TYPE: "c2d-highcpu-8"
  GCP_WIN_MACHINE_TYPE: "n2-standard-8"
  IMAGE_UBUNTU_X86_64: "platform-ingest-beats-ubuntu-2204-1794305548"
  IMAGE_UBUNTU_2004_X86_64: "platform-ingest-beats-ubuntu-2004-1794305548"
  IMAGE_RHEL9_X86_64: "platform-ingest-beats-rhel-9-1794305548"
  IMAGE_WIN_2022: "platform-ingest-beats-windows-2022-1794305548"
  IMAGE_BEATS_WITH_HOOKS_LATEST: "docker.elastic.co/ci-agent-images/platform-ingest/buildkite-agent-beats-ci-with-hooks:latest"

  #Deps
  ASDF_MAGE_VERSION: 1.15.0

  # Unit tests
  RACE_DETECTOR: "true"
  TEST_COVERAGE: "true"

# This section is used to define the plugins that will be used in the pipeline.
# See https://buildkite.com/docs/pipelines/integrations/plugins/using#using-yaml-anchors-with-plugins
common:
  - test_collector: &test_collector
      test-collector#v1.10.2:
        files: "pkg/build/TEST-*.xml"
        format: "junit"
        branches: "main"
        debug: true

steps:
  - group: "Check/Update"
    key: "pkg-check-update"

    steps:
      - label: "pkg: Run check"
        command: |
          set -eo pipefail
          make -C pkg check
          make check-no-changes
        retry:
          automatic:
            - limit: 1
        agents:
          image: "${IMAGE_BEATS_WITH_HOOKS_LATEST}"
          cpu: "4000m"
          memory: "8Gi"
          useCustomGlobalHooks: true
        notify:
          - github_commit_status:
              context: "pkg: check"

  - wait: ~
    # with PRs, we want to run mandatory tests only if check/update step succeed
    # for other cases, e.g. merge commits, we want to run mandatory test independently of other tests
    if: build.env("BUILDKITE_PULL_REQUEST") != "false"
    depends_on: "pkg-check-update"

  - group: "Mandatory Tests"
    key: "mandatory-tests"

    steps:
      - label: ":ubuntu: pkg: Ubuntu x86_64 Unit Tests"
        key: "mandatory-pkg-unit-test"
        command: |
          set -euo pipefail
          cd pkg
          mage goUnitTest
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "${IMAGE_UBUNTU_X86_64}"
          machineType: "${GCP_DEFAULT_MACHINE_TYPE}"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        plugins:
          - *test_collector
        notify:
          - github_commit_status:
              context: "pkg: Ubuntu x86_64 Unit Tests"

      - label: ":ubuntu: pkg: Ubuntu x86_64 Unit Tests with requirefips build tag"
        key: "mandatory-pkg-unit-test-fips-tag"
        command: |
          set -euo pipefail
          cd pkg
          mage goUnitTest
        env:
          FIPS: "true"
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "${IMAGE_UBUNTU_X86_64}"
          machineType: "${GCP_DEFAULT_MACHINE_TYPE}"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        plugins:
          - *test_collector
        notify:
          - github_commit_status:
              context: "pkg: Ubuntu x86_64 Unit Tests with requirefips build tag"

      # Guards against accidentally adding crypto that is not FIPS compliant.
      - label: ":ubuntu: pkg: Ubuntu x86_64 fips140=only Unit Tests"
        key: "mandatory-pkg-unit-test-fips-only"
        command: |
          set -euo pipefail
          cd pkg
          mage goFIPSOnlyUnitTest
        env:
          FIPS: "true"
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "${IMAGE_UBUNTU_X86_64}"
          machineType: "${GCP_DEFAULT_MACHINE_TYPE}"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        plugins:
          - *test_collector
        notify:
          - github_commit_status:
              context: "pkg: Ubuntu x86_64 fips140=only Unit Tests"

      - label: ":windows: pkg: Win 2022 Unit Tests"
        key: "mandatory-pkg-win-2022-unit-test"
        command: |
          Set-Location -Path pkg
          mage goUnitTest
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "${IMAGE_WIN_2022}"
          machine_type: "${GCP_WIN_MACHINE_TYPE}"
          disk_size: 100
          disk_type: "pd-ssd"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        notify:
          - github_commit_status:
              context: "pkg: Win 2022 Unit Tests"

      # Integration-tagged tests outside systemmetrics only need a Docker
      # daemon on the host, no docker-compose stack.
      - label: ":ubuntu: pkg: Ubuntu x86_64 Go Integration Tests"
        key: "mandatory-pkg-integ-test"
        command: |
          set -euo pipefail
          cd pkg
          mage goIntegTest
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "${IMAGE_UBUNTU_X86_64}"
          machineType: "${GCP_DEFAULT_MACHINE_TYPE}"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        plugins:
          - *test_collector
        notify:
          - github_commit_status:
              context: "pkg: Ubuntu x86_64 Go Integration Tests"

      # Container-System tests spin up their own Docker containers under
      # ./systemmetrics/tests/... and only need a Docker daemon (no
      # Elasticsearch compose stack). Run across images to keep coverage of:
      #   - RHEL 9
      #   - Ubuntu 20.04 (cgroup v1 host exercising metric/system/cgroup/cgv1)
      #   - Ubuntu 22.04 (cgroup v2)
      - label: ":linux: pkg/systemmetrics: Container-System Tests -- {{matrix.image}}"
        # The memory integration test keys its zswap expectations on this
        # step key (see ciExpectations in pkg/systemmetrics/metric/memory).
        key: "mandatory-systemmetrics-container-tests"
        # Matrix values are not exposed in the environment; the memory
        # integration test needs the host image to pick the right zswap
        # expectations.
        env:
          HOST_OS_IMAGE: "{{matrix.image}}"
        command: |
          set -euo pipefail
          cd pkg
          mage goSystemMetricsContainerTest
        retry:
          automatic:
            - limit: 1
        agents:
          provider: "gcp"
          image: "{{matrix.image}}"
          machineType: "${GCP_DEFAULT_MACHINE_TYPE}"
        artifact_paths:
          - "pkg/build/*.xml"
          - "pkg/build/*.json"
        plugins:
          - *test_collector
        notify:
          - github_commit_status:
              context: "pkg/systemmetrics: Container-System Tests"
        matrix:
          setup:
            image:
              - "${IMAGE_UBUNTU_X86_64}"
              - "${IMAGE_RHEL9_X86_64}"
              - "${IMAGE_UBUNTU_2004_X86_64}"
