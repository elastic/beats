---
name: Bump npcap version in elastic/beats
pipelineid: 'bump-npcap-beats-{{ source "latestNpcapVersion" }}'

# Applied from .buildkite/scripts/run-updatecli.sh via bump-npcap-pipeline.yml.
# GITHUB_TOKEN is provided by the elastic/vault-github-token Buildkite plugin
# (configure-git-user: true), which also configures the elastic-ci[bot] git identity.

scms:
  githubConfig:
    kind: github
    spec:
      user: 'elastic-ci[bot]'
      username: 'elastic-ci[bot]'
      owner: elastic
      repository: beats
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      branch: main
      commitusingapi: true

actions:
  default:
    title: 'Bump npcap OEM installer to version {{ source "latestNpcapVersion" }}'
    kind: github/pullrequest
    scmid: githubConfig
    spec:
      automerge: false
      labels:
        - automation
        - dependencies
        - backport-skip
      description: |
        Bumps the npcap OEM installer to v{{ source "latestNpcapVersion" }}.
        The artifact has been uploaded to the private GCS store by the golang-crossbuild bump-npcap automation.

        https://github.com/nmap/npcap/releases/tag/v{{ source "latestNpcapVersion" }}

sources:
  latestNpcapVersion:
    name: Get latest npcap release
    kind: githubrelease
    transformers:
      - trimprefix: v
    spec:
      owner: nmap
      repository: npcap
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      username: 'elastic-ci[bot]'
      versionfilter:
        kind: latest

conditions:
  isNewVersion:
    name: 'Is NpcapVersion already {{ source "latestNpcapVersion" }} in pcap.go?'
    disablesourceinput: true
    scmid: githubConfig
    kind: file
    spec:
      file: x-pack/packetbeat/scripts/mage/pcap.go
      matchpattern: 'NpcapVersion = "{{ source "latestNpcapVersion" }}"'
    failwhen: true

targets:
  update-pcap-go:
    name: "Update NpcapVersion in x-pack/packetbeat/scripts/mage/pcap.go"
    sourceid: latestNpcapVersion
    scmid: githubConfig
    kind: file
    spec:
      file: x-pack/packetbeat/scripts/mage/pcap.go
      matchpattern: 'NpcapVersion = "\d+\.\d+"'
      content: 'NpcapVersion = "{{ source "latestNpcapVersion" }}"'
  update-license:
    name: "Update Version in x-pack/packetbeat/npcap/installer/LICENSE"
    sourceid: latestNpcapVersion
    scmid: githubConfig
    kind: file
    spec:
      file: x-pack/packetbeat/npcap/installer/LICENSE
      line: 3
      content: 'Version: {{ source "latestNpcapVersion" }}'
