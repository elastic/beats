- key: kibana
  title: Kibana
  release: ga
  description: >
    kibana Module
  fields:
    - name: service.node.roles
      type: keyword
    - name: kibana
      type: group
      description: >
        Module for parsing Kibana logs.
      fields:
        - name: session_id
          description: The ID of the user session associated with this event. Each login attempt results in a unique session id.
          example: "123e4567-e89b-12d3-a456-426614174000"
          type: keyword
        - name: space_id
          description: "The id of the space associated with this event."
          example: "default"
          type: keyword
        - name: saved_object.type
          description: "The type of the saved object associated with this event."
          example: "dashboard"
          type: keyword
        - name: saved_object.id
          description: "The id of the saved object associated with this event."
          example: "6295bdd0-0a0e-11e7-825f-6748cda7d858"
          type: keyword
        - name: saved_object.name
          description: "The name of the saved object associated with this event."
          example: "my-saved-object"
          type: keyword
        - name: add_to_spaces
          description: "The set of space ids that a saved object was shared to."
          example: "['default', 'marketing']"
          type: keyword
        - name: delete_from_spaces
          description: "The set of space ids that a saved object was removed from."
          example: "['default', 'marketing']"
          type: keyword
        - name: diff.format
          description: "The schema of the saved object attribute diff attached to this event."
          example: "json_patch_extended"
          type: keyword
        - name: diff.ops
          type: group
          dynamic: false
          description: >
            JSON Patch operations describing the saved object attributes changed by this event, emitted when saved object diff auditing is enabled in Kibana.
            Each operation may include `value` and `oldValue` whose JSON type varies by attribute (string, number, boolean, array, or object).
            Those fields are stored in `_source` but not mapped (`dynamic: false` on this object) so mixed types cannot cause mapping conflicts.
            Mapping them as `object` with `enabled: false` is not sufficient: Elasticsearch still rejects non-object values such as strings.
          fields:
            - name: op
              description: "The operation performed on the attribute."
              example: "replace"
              type: keyword
            - name: path
              description: "RFC 6901 JSON Pointer to the changed attribute."
              example: "/title"
              type: keyword
        - name: diff.noOps.path
          description: "RFC 6901 JSON Pointer to an attribute that was not changed by this event."
          example: "/description"
          type: keyword
        - name: authentication_provider
          description: "The authentication provider associated with a login event."
          example: "basic1"
          type: keyword
        - name: authentication_type
          description: "The authentication provider type associated with a login event."
          example: "basic"
          type: keyword
        - name: authentication_realm
          description: "The Elasticsearch authentication realm name which fulfilled a login event."
          example: "native"
          type: keyword
        - name: lookup_realm
          description: "The Elasticsearch lookup realm which fulfilled a login event."
          example: "native"
          type: keyword
