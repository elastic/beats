filebeat.inputs:
  - type: tcp
    id: "tcp-1"
    host: "{{.addr}}"
    number_of_workers: 2

output.file:
    path: ${path.home}
    filename: "output"
    rotate_on_startup: false

queue.mem:
  flush:
    timeout: 0

http:
  enabled: true
  port: {{.httpPort}}

logging:
  level: debug
  selectors:
    - "input.tcp"
