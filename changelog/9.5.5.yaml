    - kind: bug-fix
      summary: Stop losing a day of azure/billing data when Cost Management returns HTTP 429
      description: |
        The azure/billing metricset now honours the throttling hints Azure Cost Management and Consumption return on HTTP 429. Those hints arrive in "x-ms-ratelimit-microsoft.*-retry-after" headers, which the Azure SDK retry policy ignores, so a throttled fetch used to fail after a few seconds of backoff and, with no cursor and a 1440m period, the whole day of billing data was lost. The longest wait advertised by those hints or by the standard Retry-After headers is now honoured before retrying, the retry budget was raised so a per-minute quota window can clear (up to 5 retries, 10s base delay, 5m cap), and every request carries a ClientType header so the calls no longer share the default Cost Management quota pool with all unidentified callers in the tenant.
      component: metricbeat
      pr:
        - https://github.com/elastic/beats/pull/53238
        - https://github.com/elastic/beats/pull/53419
        - https://github.com/elastic/beats/pull/53544
        - https://github.com/elastic/beats/pull/53521
      issue:
