    - kind: bug-fix
      summary: Fix a panic in the file_integrity eBPF backend when its eBPF loader fails to start.
      description: |
        The eBPF backend loaded its probes once to check that they work, and again when
        the module started. If the first load succeeded but the second failed, Auditbeat
        panicked with a nil pointer dereference. The probes are now loaded only when the
        module starts; if that fails, the module fails to start with the loader's error
        and a later start tries again.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/54165
        - https://github.com/elastic/beats/pull/54150
        - https://github.com/elastic/beats/pull/54154
