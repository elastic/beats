    - kind: bug-fix
      summary: Fix pgsql queries being paired with the wrong responses after a NULL column.
      description: |
        The pgsql parser read DataRow column lengths as unsigned, so the -1 that the PostgreSQL wire protocol uses to mark a NULL column was rejected as an invalid length. The response was dropped but its query stayed queued, so for the rest of that connection's life every published event carried the previous query's text against a later query's rows, and the last query was never published at all. A DataRow truncated part-way through a column length could also panic packetbeat.
      component: packetbeat
      pr:
        - https://github.com/elastic/beats/pull/54165
        - https://github.com/elastic/beats/pull/54150
        - https://github.com/elastic/beats/pull/54154
