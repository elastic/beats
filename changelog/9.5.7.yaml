    - kind: bug-fix
      summary: Reject osquery policies that cannot be applied instead of stopping osquerybeat.
      description: 'An osquery policy that fails validation, for example one with an invalid processor, an invalid ECS mapping or an invalid query schedule, is now rejected before any of it is applied: on the process runtime the osquery unit is marked failed, the previous policy keeps running, and the next valid policy clears the failure. Before, a configuration that failed to parse was ignored and the unit stayed healthy, and a policy osquerybeat could not apply stopped osquerybeat. On the OTel runtime the policy is the receiver''s static configuration and such a configuration still stops the receiver.'
      component: osquerybeat
      pr:
        - https://github.com/elastic/beats/pull/54249
      issue: []
      impact: ""
      action: ""
