    - kind: bug-fix
      summary: Keep osqueryd running when the output is slow by queueing scheduled osquery results.
      description: Osquerybeat now publishes native scheduled query results from its own queue, so a slow output no longer makes osqueryd exit with code 78. The scheduled queue holds up to osquery.elastic_options.publishing.scheduled.max_events rows (default 3200) and, when full, drops the oldest items; publishing.scheduled.max_age optionally drops items that waited too long. Queued results survive osqueryd restarts and are dropped when osquerybeat stops. Drops are counted under osquerybeat.publishing.scheduled. A policy with invalid publishing settings is rejected before any of it is applied. See x-pack/osquerybeat/docs/publishing.md.
      component: osquerybeat
      pr:
        - https://github.com/elastic/beats/pull/54251
      issue:
