    - kind: bug-fix
      summary: Fix file_integrity kprobes backend failing on kernels that list .cold symbols first
      description: |
        The kprobes backend of the file_integrity module stopped at the first /proc/kallsyms entry whose name started with the probed symbol, so on kernels that list a cold-path fragment such as fsnotify.cold ahead of fsnotify it reported "symbol fsnotify is optimised" and failed to start. Symbol lookup now scans the whole table, prefers an exact match, and ignores .cold fragments, which are not compiler clones of the function.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/54106
      issue: []
      impact: ""
      action: ""
      timestamp: 1793095203
