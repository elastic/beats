version: 9.5.7
entries:
    - kind: bug-fix
      summary: 'Fix auditd module failing or dropping events when `immutable: true` is set.'
      description: |
        With `immutable: true`, the auditd module could fail at startup with
        `Failure setting audit config as immutable` and stop collecting events, or
        drop audit events that arrived while it waited for the kernel's reply. The
        request is now sent on the control socket.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/53707
      issue: []
      impact: ""
      action: ""
      timestamp: 1791841937
      file:
        name: 1791841937-auditd-immutable-control-socket.yaml
        checksum: 169eb891f3c7e4670a87c6aa52a2d98f977037ed
    - kind: bug-fix
      summary: Stop scheduled query profiling from stalling osquery scheduled results
      description: Scheduled query profiles are now collected outside osqueryd's logger callback, so the osquery_schedule query no longer deadlocks on osqueryd's schedule mutex. Profiles are published best effort; on the OTel runtime's slab queue a full queue drops the profile, while on the memory queue a profile publish can wait for a slot, as scheduled result publishes already do. Scheduled query profile documents are now actually published, so ingest volume rises where profiling is enabled. Scheduled profiles carry the new fields schedule_id and schedule_execution_count. Profiles are published after their result, and their @timestamp is the collection time. New counters under osquerybeat.scheduled_query_profiles report collected, failed and dropped profiles.
      component: osquerybeat
      pr:
        - https://github.com/elastic/beats/pull/53775
      issue:
        - https://github.com/elastic/beats/issues/53697
      impact: ""
      action: ""
      timestamp: 1791965041
      file:
        name: 1791965041-fix-osquery-scheduled-profiling.yaml
        checksum: bfdefb5f12d25f5e7cef865d3f779325be867fb0
    - kind: bug-fix
      summary: Stop auditbeat add_session_metadata stalling audit event reading after falling behind.
      description: |
        The kernel_tracing backend of add_session_metadata waited up to 1.2 seconds
        for each process missing from its cache, regardless of how old the event
        was. Once auditbeat fell behind, every event in the backlog was for a process
        that had already exited and waited the full time, so auditbeat never caught
        up, stopped reading the audit socket, and the kernel dropped audit messages.
        The wait is now measured from the event's timestamp, so events that have
        already waited longer than the limit are not delayed further.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/53853
      issue: []
      impact: ""
      action: ""
      timestamp: 1792363230
      file:
        name: 1792363230-auditbeat-session-metadata-event-age-wait.yaml
        checksum: db68c8c4c6ffd0057f3d865aaafebfabde267cda
