version: 8.19.24
entries:
    - kind: bug-fix
      summary: Reject RESP bulk-string lengths other than -1 (nil) and >=0 in the packetbeat Redis parser
      description: |
        The Redis RESP parser forwarded invalid negative bulk-string lengths to
        streambuf.Buffer.CollectWithSuffix, which can panic on invalid slice bounds.
        These lengths are now rejected before buffer collection.
      component: packetbeat
      pr:
        - https://github.com/elastic/beats/pull/54166
        - https://github.com/elastic/beats/pull/54154
        - https://github.com/elastic/beats/pull/54223
        - https://github.com/elastic/beats/pull/54228
      issue:
        - https://github.com/elastic/beats/issues/50205
      impact: ""
      action: ""
      timestamp: 1766000000
      file:
        name: 1766000000-fix-redis-parser-negative-bulk-length-panic.yaml
        checksum: e6ba45267ace7b931284f7bae97391f82ce2ea68
    - kind: bug-fix
      summary: Resume CrowdStrike Event Streams after dropped firehose connections without exhausting retries.
      description: |
        The CrowdStrike streaming input counted a firehose connection dropped mid-stream
        (reported as "error decoding event: unexpected EOF") as a failed attempt, and only
        reset the count when a stream ended cleanly. Drops spread over hours of healthy
        streaming accumulated until max_attempts was exceeded and the input stopped until
        it was restarted. A drop after events were delivered now reconnects from the cursor
        and resets the attempt count, the unit reports healthy again once events flow, and
        feed connects, ends, interruptions and non-2xx session refresh responses are logged.
        Each session error is now counted once in errors_total, and a clean end of stream is
        not counted as an error.
      component: filebeat
      pr:
        - https://github.com/elastic/beats/pull/54166
        - https://github.com/elastic/beats/pull/54154
        - https://github.com/elastic/beats/pull/54223
        - https://github.com/elastic/beats/pull/54228
      issue: []
      impact: ""
      action: ""
      timestamp: 1790237584
      file:
        name: 1790237584-crowdstrike-stream-interruptions.yaml
        checksum: ca6dbc8ccb3c0b97184d977867e9ccfd7f1e8e78
