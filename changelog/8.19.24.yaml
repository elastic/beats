    - kind: bug-fix
      summary: Fix the file_integrity eBPF backend failing to start on Linux 6.15 and later.
      description: |
        Update github.com/elastic/ebpfevents to v0.11.0. On Linux 6.15 and later the
        file_integrity module's eBPF backend failed to load its probes with
        "bad CO-RE relocation" (tty_driver and kernfs_node changed in 6.15), so the
        module never started. File access, modification and change timestamps are
        also reported correctly again on Linux 6.11 and later. Programs that are not
        used on the running kernel are no longer loaded, which shortens startup. When
        the eBPF loader has to fall back because some probes fail to load on the
        running kernel, the module logs a warning, and it fails to start if any file
        event type it needs is disabled.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/54166
        - https://github.com/elastic/beats/pull/54154
        - https://github.com/elastic/beats/pull/54223
        - https://github.com/elastic/beats/pull/54228
      issue:
        - https://github.com/elastic/beats/issues/46719
      impact: ""
      action: ""
      timestamp: 1791394003
      file:
        name: 1791394003-auditbeat-fim-ebpf-kernel-6.15.yaml
        checksum: 51897cc6cdd62006cd99abee8fac67e3a75e3f8c
