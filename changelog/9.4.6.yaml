      summary: Add managed identity authentication to the azure-blob-storage input
      description: The azure-blob-storage input can now authenticate with the managed identity of the Azure host that runs Filebeat. Set auth.managed_identity.enabled to true to use the system-assigned identity of the host, and set auth.managed_identity.client_id to select a user-assigned identity. The configuration then holds no account key, connection string or client secret.
