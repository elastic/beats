    - kind: bug-fix
      summary: Scope the aws-s3 lexicographical polling tail to the input's bucket and key prefix.
      description: |
        All aws-s3 inputs of a process share one persistent state store. In
        lexicographical ordering mode the tail (the key passed as StartAfter to
        ListObjectsV2) was persisted under a single store key, so inputs polling
        different buckets or key prefixes read and overwrote each other's tail. An
        input could start listing after a key from another bucket and skip its own
        objects. The tail is now persisted under a key derived from the input's
        bucket and key prefix. The old unscoped key is removed on startup and the
        tail is reseeded from the input's own persisted states.
      component: filebeat
      pr: []
      issue:
        - https://github.com/elastic/beats/issues/53195
      impact: ""
      action: ""
      timestamp: 1790080783
      file:
        name: 1790080783-awss3-scope-lexicographical-tail-per-input.yaml
        checksum: 57acc4366c4cf8c256ff4527851c83ab2d088b37
