    - kind: bug-fix
      summary: Scope the aws-s3 polling state registry to the input's bucket.
      description: |
        All aws-s3 inputs of a process share one persistent state registry. Each
        polling input loaded every input's states into memory, and its periodic
        registry cleanup then deleted from the shared store all entries missing
        from its own bucket listing, including the other inputs' states. After a
        restart the affected inputs found no persisted state and re-ingested
        their buckets. Loading is now scoped to the input's bucket and key
        prefix. This also removes the duplicated memory usage of the registry
        when several polling inputs run in one process.
      component: filebeat
      pr:
        - https://github.com/elastic/beats/pull/52728
      issue:
        - https://github.com/elastic/beats/issues/52721
      impact: ""
      action: ""
