    - kind: bug-fix
      summary: Fix network flow collection under the Elastic Agent OTel runtime.
      description: |
        Under the Elastic Agent OTel runtime, the flows stream is delivered in the
        protocols list, where Packetbeat dropped it as an unknown protocol plugin,
        collecting no flow events. Flow entries in the protocols list are now routed
        to the flows configuration, and unknown protocol entries mark Packetbeat as
        degraded instead of being silently ignored.
      component: packetbeat
      pr:
        - https://github.com/elastic/beats/pull/52932
      issue:
        - https://github.com/elastic/beats/issues/52931
      impact: ""
      action: ""
      timestamp: 1788187531
      file:
        name: 1788187531-fix-otel-packetbeat-flows.yaml
        checksum: aff3292b57949bd0e0ae25df310a814c77bba275
    - kind: bug-fix
      summary: Log entity analytics sync interruption by input shutdown or reconfiguration at info level instead of error, and no longer mark the input degraded for it.
      description: |
        When an entity analytics sync was interrupted because the input's
        context was cancelled — agent shutdown, restart, or a policy change
        re-rendering the input mid-sync — the failure was logged as an error
        such as "Error running full sync: ... context canceled" and the
        input was marked Degraded. This routine lifecycle event is now
        logged at info level as a sync interruption and no longer degrades
        the input's status. All entity analytics providers
        (activedirectory, azuread, jamf, okta) and the minimal-state runner
        are covered. Other errors, including context deadline expiry, keep
        the previous error treatment.
      component: filebeat
      pr:
        - https://github.com/elastic/beats/pull/52973
      issue:
        - https://github.com/elastic/beats/issues/52945
      impact: ""
      action: ""
      timestamp: 1788204683
      file:
        name: 1788204683-entityanalytics-canceled-sync-logging.yaml
        checksum: 84d4c0bde41ff4a6ade4eb227a679589efc61d05
