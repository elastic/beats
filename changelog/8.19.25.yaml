        - https://github.com/elastic/beats/pull/54693
        - https://github.com/elastic/beats/pull/54695
      issue:
        - https://github.com/elastic/beats/issues/54257
      impact: ""
      action: ""
      timestamp: 1793095203
      file:
        name: 1793095203-auditbeat-fim-kprobes-cold-symbols.yaml
        checksum: 028c6f5ddbf1ecf60edfc6d6497df3bb22b886d5
    - kind: bug-fix
      summary: Fix PowerShell module pipeline failure on unexpected or localized ParameterBinding lines.
      description: |
        The powershell and powershell_operational ingest pipelines threw
        "Index 4 out of bounds for length 4" when a ParameterBinding line did not
        match the English-only name/value labels, marking the document with
        event.kind pipeline_error. Unexpected lines are now kept as the raw value,
        and localized labels (e.g. German Name=/Wert=) are parsed.
      component: winlogbeat
