    - kind: bug-fix
      summary: Fix PowerShell module pipeline failure on event 4103 with multi-line ContextInfo values.
      description: |
        The powershell_operational ingest pipeline failed with "field
        [winlog.event_data.ContextInfo] does not contain value_split [[:=]]" when
        Host Application held a multi-line script, for example one passed to
        powershell.exe -Command. The ContextInfo block is now parsed by a script
        that uses its fixed 16-key layout, so the full script is kept in
        process.command_line and script lines that look like keys are not taken as
        keys. Localized keys, including ones with non-ASCII letters or apostrophes,
        are still parsed as separate fields, and dots are removed from event_data
        keys (for example the Spanish "Id. de host" becomes "Iddehost") so they
        are not read as object paths.
      component: winlogbeat
      pr:
        - https://github.com/elastic/beats/pull/54279
        - https://github.com/elastic/beats/pull/54573
        - https://github.com/elastic/beats/pull/54634
        - https://github.com/elastic/beats/pull/51019
        - https://github.com/elastic/beats/pull/54650
        - https://github.com/elastic/beats/pull/54693
        - https://github.com/elastic/beats/pull/54695
      issue:
