        - https://github.com/elastic/beats/pull/54693
        - https://github.com/elastic/beats/pull/54695
      issue:
        - https://github.com/elastic/beats/issues/54257
      impact: ""
      action: ""
      timestamp: 1792363230
      file:
        name: 1792363230-auditbeat-session-metadata-event-age-wait.yaml
        checksum: db68c8c4c6ffd0057f3d865aaafebfabde267cda
