# Kind can be one of:
# - breaking-change: a change to previously-documented behavior
# - deprecation: functionality that is being removed in a later release
# - bug-fix: fixes a problem in a previous version
# - enhancement: extends functionality but does not break or fix existing behavior
# - known-issue: problems that we are aware of in a given version
# - security: impacts on the security of a product or a user's deployment.
# - upgrade: important information for someone upgrading from a prior version
# - other: does not fit into any of the other categories
kind: bug-fix

# Change summary; a 80ish characters long description of the change.
summary: Reduce memory usage when running inputs with state (cel, httpjson, gcs, azureblobstorage, and others) as Beat receiver.

# Long description; in case the summary is not enough to describe the change
# this field accommodate a description without length limits.
description: >
  When Elastic Agent runs in OTel mode it starts one Beat receiver per input
  stream. Cursor-based inputs (cel, httpjson, gcs, azureblobstorage, and
  others) each opened their own copy of the registry state table and their own
  cleanup goroutine, even when multiple receivers shared the same registry
  backend. This caused the full cursor state to be loaded into memory once per
  receiver, with memory use growing linearly with the number of streams.

  Cursor inputs now share a single in-memory state table and cleaner per
  registry backend, the same approach already used by filestream since #52326.
  Memory use is now constant with respect to the number of receivers sharing a
  backend.

# Affected component; usually one of "elastic-agent", "fleet-server", "filebeat", "metricbeat", "auditbeat", "all", etc.
component: filebeat

