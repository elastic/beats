kind: enhancement

summary: Remove resolved secret store values from Heartbeat monitor events, errors and logs.

description: >
  Secrets that Heartbeat resolves from secret stores, such as HashiCorp Vault,
  are replaced with `<hidden>` in the events and error messages of the monitor,
  for example in `url.full` or `error.message`, and in the log lines the
  monitor writes, including the output of the browser runner. Percent-encoded
  values are replaced too.

component: heartbeat

issue: https://github.com/elastic/beats/issues/52677
