kind: enhancement

summary: Remove resolved secret store values from Heartbeat monitor events, errors and logs.

description: >
  Secrets that Heartbeat resolves from secret stores, such as HashiCorp Vault,
  are replaced with `<hidden>` in the events and errors of the monitor, for
  example in `url.full`, `error.message` or `error.stack_trace`, and in the log
  lines the monitor writes, including the output of the browser runner. Common
  percent-encoded and JSON-escaped forms, and each line of multi-line values,
  are replaced too. Event fields whose whole value is a secret, such as
  `monitor.ip`, are left out.

component: heartbeat

issue: https://github.com/elastic/beats/issues/52677
