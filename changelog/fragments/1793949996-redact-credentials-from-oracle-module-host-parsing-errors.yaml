kind: bug-fix
summary: Redact credentials from Oracle module host parsing errors.
description: >-
  When an `oracle` module host failed to parse, for example because of an invalid port or a
  malformed URL escape in the password, the startup error included the full connection string
  with the password. The error now replaces the connection string with `(redacted)`, matching
  the `sql` module.
component: metricbeat
pr: https://github.com/elastic/beats/pull/54523
