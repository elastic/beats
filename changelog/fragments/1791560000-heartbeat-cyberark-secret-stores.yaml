kind: feature

summary: Resolve CyberArk Central Credential Provider secret references in Heartbeat monitor configurations.

description: >
  Monitors can reference CyberArk accounts as `cyberark://<safe>/<object>#<field>`
  (or `cyberark://<safe>/<folder>/<object>#<field>`), with the CyberArk Central
  Credential Provider (CCP) connection configured in the `secret_stores` monitor
  setting (`type: cyberark`). Secrets are resolved on each run and cached for up
  to 5 minutes.

component: heartbeat

issue: https://github.com/elastic/beats/issues/52677
