kind: enhancement

summary: >
  add_kubernetes_metadata: events matched from /var/log/pods/ with resource_type:pod now
  include container.name and container.image (always), plus container.id and container.runtime
  for the currently-running log file. Rotated log files from earlier container restarts receive
  name and image only.

component: libbeat

issue: https://github.com/elastic/beats/issues/48922
