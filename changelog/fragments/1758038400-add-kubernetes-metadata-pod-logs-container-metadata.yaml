kind: enhancement

summary: >
  add_kubernetes_metadata: events matched from /var/log/pods/ with resource_type:pod now
  include kubernetes.container.name and container.image.name (always), plus container.id and
  container.runtime for the currently-running log file. The immediately preceding restart also
  receives container.id and container.runtime when its container ID is available from
  LastTerminationState. Older rotated log files receive kubernetes.container.name and
  container.image.name only.

component: libbeat

issue: https://github.com/elastic/beats/issues/48922
