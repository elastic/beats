kind: enhancement
summary: Mask credentials in request traces of HTTP-based Filebeat inputs.
description: |
  The request tracer now replaces the values of credential headers, credential URL query
  parameters, URL user info, and credential fields in form and JSON bodies with REDACTED.
  This includes OAuth2 client secrets, passwords, and access, refresh and ID tokens in token
  requests and responses. The scheme of Authorization headers remains visible, and header
  names are matched without regard to case.
component: filebeat
