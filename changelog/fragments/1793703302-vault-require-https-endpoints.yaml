kind: security

summary: Require verified HTTPS for remote Heartbeat Vault secret stores.

description: >
  Heartbeat now rejects plaintext HTTP and `ssl.verification_mode: none` or
  `certificate` for non-loopback Vault secret store addresses. Existing remote
  Vault connections must use HTTPS with certificate and hostname verification.
  To trust a private CA, configure `ssl.certificate_authorities` instead of
  weakening verification.

component: heartbeat

issue: https://github.com/elastic/beats/issues/54397
