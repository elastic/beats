kind: feature

summary: Resolve HashiCorp Vault secret references in Heartbeat monitor configurations.

description: >
  Monitors can reference secrets as `$vault{<path>#<field>}` and configure the
  Vault connection in the new `secret_stores` monitor setting, with token or
  AppRole authentication. Heartbeat resolves the references when it creates the
  monitor, so secret values never need to be stored in the monitor configuration.

component: heartbeat

issue: https://github.com/elastic/beats/issues/52677
