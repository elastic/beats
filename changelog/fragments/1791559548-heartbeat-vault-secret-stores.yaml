kind: feature

summary: Resolve HashiCorp Vault secret references in Heartbeat monitor configurations.

description: >
  Monitors can reference secrets as `vault://<path>#<field>`, with the Vault
  connection set in the new `secret_stores` setting (token or AppRole auth).
  Secrets are resolved on each run and cached for up to 5 minutes, so rotated
  secrets are picked up automatically. If Vault is unavailable, the monitor is
  reported down.

component: heartbeat

issue: https://github.com/elastic/beats/issues/52677
