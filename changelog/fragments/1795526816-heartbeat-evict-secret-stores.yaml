kind: security

summary: Evict unused Heartbeat secret stores and revoke Vault AppRole tokens on removal or shutdown.

description: >
  Heartbeat now reference-counts cached secret store connections and evicts
  them when no configured monitor references them anymore, clearing cached
  secrets and credentials from memory. For HashiCorp Vault AppRole connections,
  Heartbeat also revokes the acquired client token via `auth/token/revoke-self`
  on eviction and shutdown. User-supplied static tokens are not revoked.

component: heartbeat

issue: https://github.com/elastic/beats/issues/54400
