# Kind can be one of:
# - breaking-change: a change to previously-documented behavior
# - deprecation: functionality that is being removed in a later release
# - bug-fix: fixes a problem in a previous version
# - enhancement: extends functionality but does not break or fix existing behavior
# - feature: new functionality
# - known-issue: problems that we are aware of in a given version
# - security: impacts on the security of a product or a user’s deployment.
# - upgrade: important information for someone upgrading from a prior release
# - other: does not fit into any of the other categories
kind: enhancement

# Change summary; a 80ish characters long description of the change.
summary: Identify each azure/billing fetch and the queried scope on every event

# Long description; in case the summary is not enough to describe the change
# this field accommodate a description without length limits.
description: >
  The azure/billing metricset re-fetches whole days on every run, and the Azure
  Usage Details API does not give individual rows a unique identifier, so
  consumers that want the latest complete snapshot of a day could not tell one
  run's rows apart from the previous run's. Every usage detail and forecast event
  of a run now carries the same `azure.billing.fetch_id` and the same
  `@timestamp` (the run's reference time, instead of a per-event clock reading),
  so a run can be identified exactly. Every event also carries
  `azure.billing.scope`, the subscription, department, or billing account the
  data was queried for; forecast events previously only carried the configured
  subscription ID, which is the same for policies that query different
  departments or billing accounts.

# Affected component; usually one of "elastic-agent", "fleet-server", "filebeat", "metricbeat", "auditbeat", "all", etc.
component: metricbeat

