    - kind: bug-fix
      summary: Fix duplicate event IDs for codec-decoded objects in the GCS and Azure Blob Storage inputs.
      description: |
        Events produced by a decoding codec (CSV) from the same object all
        got the same `_id` and `log.offset: 0`, so only the first record of each
        object was indexed. Each event now gets a unique ID derived from its record
        index, and `log.offset` holds that index.
      component: filebeat
      pr:
        - https://github.com/elastic/beats/pull/54157
      issue:
        - https://github.com/elastic/beats/issues/53659
      impact: ""
      action: ""
      timestamp: 1793120788
      file:
