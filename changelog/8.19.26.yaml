    - kind: bug-fix
      summary: Limit how often Packetbeat process enrichment scans /proc.
      description: Each lookup miss used to walk every file descriptor of every process on the host, which could saturate the sniffer. On Linux the walk is now skipped when the socket table shows no open socket on the port. Lookups are also spaced so that, for each transport, they take about a tenth of the time, and max_proc_read_freq can add a fixed minimum interval between full scans. A connection opened and closed between scans may be published without process information. Mappings confirmed by a scan stay valid for at least 10s after that scan, and on Linux vanished PIDs are logged at debug level.
      component: packetbeat
      pr:
        - https://github.com/elastic/beats/pull/54606
      issue: []
      impact: ""
      action: ""
      timestamp: 1794400000
      file:
        name: 1794400000-packetbeat-procs-scan-throttle.yaml
        checksum: f26f645f2cf966999db4629ba63e0cb4126c0f32
    - kind: bug-fix
      summary: Fix auditd lost event monitor leaking a socket and crashing without a client.
      description: |
        The kernel lost event monitor closed the wrong audit client when it stopped,
        leaving its own netlink socket open. If creating that client failed, the
        monitor still started and crashed on its first poll, which stopped
        Auditbeat, or the Elastic Agent process running it as a receiver. The
        monitor now closes its own client. If the client cannot be created,
        Auditbeat reports the error and stops updating the kernel lost events
        metric instead of crashing.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/54645
      issue: []
      impact: ""
      action: ""
      timestamp: 1794456064
      file:
        name: 1794456064-auditd-kernel-lost-monitor.yaml
        checksum: d5866b37b7da7c358bda97784f409e4a66d38f41
    - kind: bug-fix
      summary: Fix auditd module leaking a socket when it fails to create its data client.
      description: |
        When the auditd module could not create its data client, for example because
        the process had no file descriptors left, it returned an error without
        closing the control client it had already created. That socket stayed open
        for the life of the process. It is now closed.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/54651
      issue:
        - https://github.com/elastic/beats/issues/54644
      impact: ""
      action: ""
      timestamp: 1794512032
      file:
        name: 1794512032-auditd-new-closes-control.yaml
        checksum: b8552c2da807194adce60513a3640c204a80faa3
    - kind: bug-fix
      summary: Accept client certificates signed by CAs added to `certificate_authorities` while a TLS server is running.
      description: |
        With `ssl.certificate_reload` enabled (the default when `certificate_authorities`
        is set), a running TLS server reloaded `certificate_authorities` from disk but
        still rejected client certificates signed by a CA added after startup, because
        the Go TLS stack verified them against the CA pool captured when the server
        was configured. Removing a CA already took effect. The server now uses the
        current CA pool for each handshake, both to verify client certificates and to
        advertise acceptable CAs to clients.
      component: libbeat
      pr:
        - https://github.com/elastic/beats/pull/54749
      issue:
        - https://github.com/elastic/beats/issues/54742
      impact: ""
      action: ""
      timestamp: 1794930537
