version: 8.19.26
entries:
    - kind: upgrade
      summary: Update go-quark for quark 0.8 since-boot timestamps
      description: |
        quark 0.8 hands out process timestamps as nanoseconds since boot instead of since the epoch. Auditbeat now converts process.start/process.end to wallclock with quark.TimeToWallclock() and keeps quark's boottime epoch fresh, so timestamps stay correct even when the system clock is stepped, as when NTP corrects a clock that was wrong at boot. Emitted events are unchanged.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/52623
      issue: []
      impact: ""
      action: ""
      timestamp: 1786630989
      file:
        name: 1786630989-auditbeat-quark-0.8.yaml
        checksum: 2b331924b52580290b971998c7e783f49ddaff80
    - kind: upgrade
      summary: Update go-quark for quark 0.9 boottime handling
      description: |
        quark 0.9 removed quark.TimeToWallclock() and quark.UpdateBoottime(), the boottime epoch from quark.Boottime() is now self-maintaining and only moves on a system clock step. Auditbeat now converts process.start/process.end to wallclock by fetching the epoch once per batch and adding it to quark's since-boot timestamps, instead of one cgo call per timestamp. Emitted events are unchanged.
      component: auditbeat
      pr:
        - https://github.com/elastic/beats/pull/53284
      issue: []
      impact: ""
      action: ""
      timestamp: 1789463004
      file:
        name: 1789463004-auditbeat-quark-0.9-boottime.yaml
        checksum: 1d22cc771b51ffb9558925143bf140c0be318186
    - kind: bug-fix
      summary: Limit HTTP Endpoint request bodies buffered for HMAC validation to 25 MiB when max_body_bytes is not set
      description: |
        The http_endpoint input buffers the whole request body in memory to check
        an HMAC signature. That read now stops at 25 MiB when max_body_bytes is not
        set, and larger bodies are rejected with a 413 status. The bytes read also
        count towards max_in_flight_bytes when it is set.
      component: filebeat
      pr:
        - https://github.com/elastic/beats/pull/53937
      issue: []
      impact: ""
      action: ""
