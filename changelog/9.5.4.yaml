    - kind: enhancement
      summary: Add hostname overrides for Beat events
      description: 'The hostname can be overridden with the --hostname flag or the top-level hostname config field. The flag wins when both are set. The config field also works for beats running as OTel receivers, which never see CLI flags. The add_host_metadata and add_observer_metadata processors honor the override: host.name reflects the override value, and observer.hostname does too when add_observer_metadata is in the pipeline. The override value is trimmed of whitespace; casing is preserved as supplied.'
