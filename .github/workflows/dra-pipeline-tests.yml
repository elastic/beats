name: DRA pipeline tests

on:
  pull_request:
    paths:
      - '.buildkite/dra-prep-pipeline.yml'
      - '.buildkite/packaging.pipeline.yml'
      - '.buildkite/scripts/dra-annotate.sh'
      - '.buildkite/scripts/stage-dra-artifacts.sh'
      - '.buildkite/scripts/version_qualifier.sh'
      - '.buildkite/scripts/packaging/resolve-dra-version.sh'
      - '.buildkite/scripts/tests/**'
      - '.github/workflows/dra-pipeline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dra-pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run isolated DRA pipeline tests
        run: bats .buildkite/scripts/tests/
