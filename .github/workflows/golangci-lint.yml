name: golangci-lint
on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main
  #    - 8.*
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.go-version'
      - '.golangci.yml'
      - '.github/workflows/golangci-lint.yml'

permissions:
  contents: read
  pull-requests: read
jobs:
  golangci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # --new-from-merge-base below needs the history of the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Install Apt Package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev librpm-dev

      - name: golangci-lint
        env:
          CGO_ENABLED: 1
        # Pin the full commit hash
        # https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version-file: .golangci-lint-version

          # Give the job more time to execute.
          #
          # Issues are reported only on the lines the pull request changed.
          # This is not done with the action's `only-new-issues` option: that
          # one fetches the diff from the GitHub API, which refuses diffs over
          # 20000 lines or 300 files and then silently lints the whole
          # repository instead. --new-from-merge-base computes the same filter
          # locally from git and has no size limit. `base_ref` is empty on
          # workflow_dispatch, where there is nothing to compare against.
          args: >-
            --timeout=90m
            ${{ github.base_ref && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }}
